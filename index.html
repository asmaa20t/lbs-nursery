<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBS Nursery - Parent-Teacher Conference</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #1e4d3b;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        input:focus, select:focus {
            border-color: #1e4d3b;
            box-shadow: 0 0 5px rgba(30, 77, 59, 0.3);
        }
        .btn {
            width: 100%;
            background-color: #1e4d3b;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #143528;
        }
        .link-btn {
            background: none;
            border: none;
            color: #2563eb;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 15px;
            font-size: 14px;
        }
        .ticket {
            display: none;
            background: #e8f5e9;
            border: 2px dashed #2e7d32;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        .ticket-number {
            font-size: 48px;
            font-weight: bold;
            color: #2e7d32;
            margin: 10px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: right;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
        }
        th {
            background-color: #f0f0f0;
            color: #333;
        }
        .hidden {
            display: none;
        }
        .loading {
            display: none;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- واجهة ولي الأمر -->
    <div id="parentView" class="card">
        <h1>LBS Nursery</h1>
        <div class="subtitle">لقاء أولياء الأمور<br><small>Parent–Teacher Conference</small></div>

        <form id="queueForm">
            <div class="form-group">
                <label>Class / الفصل</label>
                <select id="classSelect" required>
                    <option value="Moon">Moon (المعلمة: ward)</option>
                    <option value="Bees">Bees (المعلمة: Maram)</option>
                    <option value="Butterfly">Butterfly (المعلمة: Rawa)</option>
                    <option value="Birds">Birds (المعلمة: Gana)</option>
                    <option value="Mushroom">Mushroom (المعلمة: Dana)</option>
                    <option value="Jangle">Jangle (المعلمة: Fozia)</option>
                    <option value="Under the sea">Under the sea (المعلمة: Nas)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Child Name / اسم الطفل</label>
                <input type="text" id="childName" required placeholder="أدخل اسم الطفل">
            </div>

            <div class="form-group">
                <label>Parent Name / اسم ولي الأمر</label>
                <input type="text" id="parentName" required placeholder="أدخل اسم ولي الأمر">
            </div>

            <div class="form-group">
                <label>Mobile Number / رقم الجوال</label>
                <input type="tel" id="mobileNumber" required placeholder="05XXXXXXXX">
            </div>

            <button type="submit" id="submitBtn" class="btn">Get Queue Number / الحصول على رقم</button>
            <div id="loadingText" class="loading">جاري إرسال الطلب وحجز الرقم...</div>
        </form>

        <div id="ticketResult" class="ticket">
            <h3>رقم الانتظار الخاص بك</h3>
            <div id="queueNum" class="ticket-number">#0</div>
            <p id="ticketInfo" style="margin: 0; color: #555;"></p>
        </div>

        <button class="link-btn" onclick="toggleView('teacher')">Teacher / Admin (دخول المعلمات)</button>
    </div>

    <!-- واجهة المعلمة -->
    <div id="teacherView" class="card hidden">
        <h1>واجهة المعلمة</h1>
        <div class="subtitle">عرض قائمة الانتظار للفصل</div>

        <div class="form-group">
            <label>اسم المعلمة (Teacher Name):</label>
            <input type="text" id="teacherNameInput" placeholder="أدخلي اسمك هنا" oninput="loadTeacherData()">
        </div>

        <div class="form-group">
            <label>اختر الفصل (Class):</label>
            <select id="teacherClassSelect" onchange="loadTeacherData()">
                <option value="Moon">Moon - ward</option>
                <option value="Bees">Bees - Maram</option>
                <option value="Butterfly">Butterfly - Rawa</option>
                <option value="Birds">Birds - Gana</option>
                <option value="Mushroom">Mushroom - Dana</option>
                <option value="Jangle">Jangle - Fozia</option>
                <option value="Under the sea">Under the sea - Nas</option>
            </select>
        </div>

        <div id="teacherWelcome" style="margin-bottom: 10px; font-weight: bold; color: #1e4d3b;"></div>

        <button class="btn" style="background-color: #2196F3; margin-bottom: 15px;" onclick="loadTeacherData()">تحديث القائمة 🔄</button>

        <table>
            <thead>
                <tr>
                    <th>الرقم</th>
                    <th>اسم الطفل</th>
                    <th>اسم ولي الأمر</th>
                    <th>الجوال</th>
                </tr>
            </thead>
            <tbody id="studentList">
                <!-- سيتم عرض البيانات هنا -->
            </tbody>
        </table>

        <button class="link-btn" onclick="toggleView('parent')">العودة لواجهة ولي الأمر</button>
    </div>

    <script>
        // الرابط الخاص بك مدمج هنا وجاهز
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5kYGe_0708xxWCSAsh1oUG0aZbewfl4RF1tV8dXmQul5IuN8TMf3WfSYboALYlVwt/exec";

        const form = document.getElementById('queueForm');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            document.getElementById('submitBtn').disabled = true;
            document.getElementById('loadingText').style.display = 'block';

            const className = document.getElementById('classSelect').value;
            const childName = document.getElementById('childName').value;
            const parentName = document.getElementById('parentName').value;
            const mobileNumber = document.getElementById('mobileNumber').value;

            const url = `${SCRIPT_URL}?action=getQueue&className=${encodeURIComponent(className)}&childName=${encodeURIComponent(childName)}&parentName=${encodeURIComponent(parentName)}&mobileNumber=${encodeURIComponent(mobileNumber)}`;

            fetch(url)
            .then(res => res.json())
            .then(data => {
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('loadingText').style.display = 'none';

                if (data.result === "success") {
                    document.getElementById('queueNum').innerText = '#' + data.queueNumber;
                    document.getElementById('ticketInfo').innerText = `الفصل: ${className} | الطفل: ${childName}`;
                    document.getElementById('ticketResult').style.display = 'block';
                    form.reset();
                } else {
                    alert("حدث خطأ أثناء الحفظ.");
                }
            })
            .catch(err => {
                alert("حدث خطأ في الاتصال، يرجى المحاولة مرة أخرى.");
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('loadingText').style.display = 'none';
            });
        });

        function toggleView(view) {
            if (view === 'teacher') {
                document.getElementById('parentView').classList.add('hidden');
                document.getElementById('teacherView').classList.remove('hidden');
                loadTeacherData();
            } else {
                document.getElementById('teacherView').classList.add('hidden');
                document.getElementById('parentView').classList.remove('hidden');
            }
        }

        function loadTeacherData() {
            const className = document.getElementById('teacherClassSelect').value;
            const teacherName = document.getElementById('teacherNameInput').value;
            const tbody = document.getElementById('studentList');

            if (teacherName.trim() !== "") {
                document.getElementById('teacherWelcome').innerText = `أهلاً المعلمة: ${teacherName} - الفصل: ${className}`;
            } else {
                document.getElementById('teacherWelcome').innerText = `الفصل المحدد: ${className}`;
            }

            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">جاري تحميل البيانات من جوجل...</td></tr>';

            fetch(`${SCRIPT_URL}?className=${encodeURIComponent(className)}`)
            .then(res => res.json())
            .then(data => {
                tbody.innerHTML = '';
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">لا يوجد مسجلين في هذا الفصل حتى الآن.</td></tr>';
                    return;
                }

                data.forEach(item => {
                    const row = `<tr>
                        <td><b>#${item.number}</b></td>
                        <td>${item.childName}</td>
                        <td>${item.parentName}</td>
                        <td>${item.mobile}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            })
            .catch(err => {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">تعذر جلب البيانات.</td></tr>';
            });
        }
    </script>
</body>
</html>
