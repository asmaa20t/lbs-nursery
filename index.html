<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LBS Nursery - Parent-Teacher Conference</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            color: #1e4d3b;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 25px;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        input:focus, select:focus {
            border-color: #1e4d3b;
            box-shadow: 0 0 5px rgba(30, 77, 59, 0.3);
        }
        .btn {
            width: 100%;
            background-color: #1e4d3b;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #143528;
        }
        .btn:disabled {
            opacity: 0.65;
            cursor: wait;
        }
        .link-btn {
            background: none;
            border: none;
            color: #2563eb;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 15px;
            font-size: 14px;
        }
        .ticket {
            display: none;
            background: #e8f5e9;
            border: 2px dashed #2e7d32;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        .ticket-number {
            font-size: 48px;
            font-weight: bold;
            color: #2e7d32;
            margin: 10px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            text-align: right;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
            overflow-wrap: anywhere;
        }
        th {
            background-color: #f0f0f0;
            color: #333;
        }
        .hidden {
            display: none !important;
        }
        .loading {
            display: none;
            color: #666;
            margin-top: 10px;
        }
        .status-message {
            margin-top: 12px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }
        .error-message {
            color: #b42318;
        }
    </style>
</head>
<body>

    <!-- واجهة ولي الأمر -->
    <div id="parentView" class="card">
        <h1>LBS Nursery</h1>
        <div class="subtitle">
            لقاء أولياء الأمور<br>
            <small>Parent–Teacher Conference</small>
        </div>

        <form id="queueForm">
            <div class="form-group">
                <label for="classSelect">Class / الفصل</label>
                <select id="classSelect" required>
                    <option value="Moon">Moon (المعلمة: ward)</option>
                    <option value="Bees">Bees (المعلمة: Maram)</option>
                    <option value="Butterfly">Butterfly (المعلمة: Rawa)</option>
                    <option value="Birds">Birds (المعلمة: Gana)</option>
                    <option value="Mushroom">Mushroom (المعلمة: Dana)</option>
                    <option value="Jangle">Jangle (المعلمة: Fozia)</option>
                    <option value="Under the sea">Under the sea (المعلمة: Nas)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="childName">Child Name / اسم الطفل</label>
                <input type="text" id="childName" required maxlength="100"
                       placeholder="أدخل اسم الطفل">
            </div>

            <div class="form-group">
                <label for="parentName">Parent Name / اسم ولي الأمر</label>
                <input type="text" id="parentName" required maxlength="100"
                       placeholder="أدخل اسم ولي الأمر">
            </div>

            <div class="form-group">
                <label for="mobileNumber">Mobile Number / رقم الجوال</label>
                <input type="tel" id="mobileNumber" required maxlength="20"
                       placeholder="05XXXXXXXX">
            </div>

            <button type="submit" id="submitBtn" class="btn">
                Get Queue Number / الحصول على رقم
            </button>

            <div id="loadingText" class="loading" role="status">
                جاري إرسال الطلب وحجز الرقم...
            </div>
            <div id="parentError" class="status-message error-message"
                 role="alert"></div>
        </form>

        <div id="ticketResult" class="ticket" aria-live="polite">
            <h3>رقم الانتظار الخاص بك</h3>
            <div id="queueNum" class="ticket-number">#0</div>
            <p id="ticketInfo" style="margin: 0; color: #555;"></p>
        </div>

        <button class="link-btn" type="button"
                onclick="toggleView('teacher')">
            Teacher / Admin (دخول المعلمات)
        </button>
    </div>

    <!-- واجهة المعلمة -->
    <div id="teacherView" class="card hidden">
        <h1>واجهة المعلمة</h1>
        <div class="subtitle">عرض قائمة الانتظار للفصل</div>

        <div class="form-group">
            <label for="teacherNameInput">اسم المعلمة (Teacher Name):</label>
            <input type="text" id="teacherNameInput"
                   placeholder="أدخلي اسمك هنا"
                   oninput="updateTeacherWelcome()">
        </div>

        <div class="form-group">
            <label for="teacherClassSelect">اختر الفصل (Class):</label>
            <select id="teacherClassSelect" onchange="loadTeacherData()">
                <option value="Moon">Moon - ward</option>
                <option value="Bees">Bees - Maram</option>
                <option value="Butterfly">Butterfly - Rawa</option>
                <option value="Birds">Birds - Gana</option>
                <option value="Mushroom">Mushroom - Dana</option>
                <option value="Jangle">Jangle - Fozia</option>
                <option value="Under the sea">Under the sea - Nas</option>
            </select>
        </div>

        <div id="teacherWelcome"
             style="margin-bottom: 10px; font-weight: bold; color: #1e4d3b;"></div>

        <button type="button" class="btn"
                style="background-color: #2196F3; margin-bottom: 15px;"
                id="refreshBtn" onclick="loadTeacherData()">
            تحديث القائمة 🔄
        </button>

        <div id="teacherStatus" class="status-message" role="status"></div>

        <table>
            <thead>
                <tr>
                    <th>الرقم</th>
                    <th>اسم الطفل</th>
                    <th>اسم ولي الأمر</th>
                    <th>الجوال</th>
                </tr>
            </thead>
            <tbody id="studentList">
                <tr>
                    <td colspan="4" style="text-align:center;">
                        اختاري الفصل لعرض البيانات.
                    </td>
                </tr>
            </tbody>
        </table>

        <button class="link-btn" type="button"
                onclick="toggleView('parent')">
            العودة لواجهة ولي الأمر
        </button>
    </div>

    <script>
        // رابط النشر الأصلي في Google Apps Script
        const SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbx5kYGe_0708xxWCSAsh1oUG0aZbewfl4RF1tV8dXmQul5IuN8TMf3WfSYboALYlVwt/exec";

        const form = document.getElementById('queueForm');
        const submitBtn = document.getElementById('submitBtn');
        const loadingText = document.getElementById('loadingText');
        const parentError = document.getElementById('parentError');

        // تحويل الاستجابة إلى JSON مع إظهار خطأ واضح عند فشل التحويل
        async function fetchJSON(url) {
            const response = await fetch(url, {
                method: 'GET',
                redirect: 'follow',
                cache: 'no-store'
            });

            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }

            return await response.json();
        }

        // تسجيل ولي الأمر وحجز رقم الدور
        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            if (submitBtn.disabled) return;

            submitBtn.disabled = true;
            loadingText.style.display = 'block';
            parentError.textContent = '';

            const className =
                document.getElementById('classSelect').value.trim();
            const childName =
                document.getElementById('childName').value.trim();
            const parentName =
                document.getElementById('parentName').value.trim();
            const mobileNumber =
                document.getElementById('mobileNumber').value.trim();

            const params = new URLSearchParams({
                action: 'getQueue',
                className,
                childName,
                parentName,
                mobileNumber
            });

            try {
                const data = await fetchJSON(
                    SCRIPT_URL + '?' + params.toString()
                );

                if (data.result !== 'success') {
                    throw new Error('لم يؤكد السكربت نجاح التسجيل.');
                }

                document.getElementById('queueNum').textContent =
                    '#' + data.queueNumber;

                document.getElementById('ticketInfo').textContent =
                    'الفصل: ' + className + ' | الطفل: ' + childName;

                document.getElementById('ticketResult').style.display =
                    'block';

                // لا نمسح النموذج إلا بعد تأكيد نجاح التسجيل
                form.reset();

            } catch (err) {
                console.error('خطأ التسجيل:', err);

                parentError.textContent =
                    'تعذّر تأكيد التسجيل. تحققي من الاتصال قبل إعادة المحاولة، حتى لا يتكرر التسجيل.';
            } finally {
                submitBtn.disabled = false;
                loadingText.style.display = 'none';
            }
        });

        // الانتقال بين واجهتي ولي الأمر والمعلمة
        function toggleView(view) {
            if (view === 'teacher') {
                document.getElementById('parentView')
                    .classList.add('hidden');
                document.getElementById('teacherView')
                    .classList.remove('hidden');

                updateTeacherWelcome();
                loadTeacherData();
            } else {
                document.getElementById('teacherView')
                    .classList.add('hidden');
                document.getElementById('parentView')
                    .classList.remove('hidden');
            }
        }

        // تحديث الترحيب بالمعلمة
        function updateTeacherWelcome() {
            const className =
                document.getElementById('teacherClassSelect').value;
            const teacherName =
                document.getElementById('teacherNameInput').value.trim();

            document.getElementById('teacherWelcome').textContent =
                teacherName
                    ? 'أهلاً المعلمة: ' + teacherName + ' - الفصل: ' + className
                    : 'الفصل المحدد: ' + className;
        }

        // جلب قائمة الانتظار للفصل المختار
        async function loadTeacherData() {
            const className =
                document.getElementById('teacherClassSelect').value;
            const tbody = document.getElementById('studentList');
            const status = document.getElementById('teacherStatus');
            const refreshBtn = document.getElementById('refreshBtn');

            updateTeacherWelcome();

            tbody.innerHTML =
                '<tr><td colspan="4" style="text-align:center;">جاري تحميل البيانات من جوجل...</td></tr>';
            status.textContent = '';
            refreshBtn.disabled = true;

            const params = new URLSearchParams({ className });

            try {
                const data = await fetchJSON(
                    SCRIPT_URL + '?' + params.toString()
                );

                if (!Array.isArray(data)) {
                    throw new Error(
                        'الاستجابة ليست قائمة بيانات. تحققي من كود Apps Script.'
                    );
                }

                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML =
                        '<tr><td colspan="4" style="text-align:center;">لا يوجد مسجلون في هذا الفصل حتى الآن.</td></tr>';
                    return;
                }

                data.forEach(function (item) {
                    const row = document.createElement('tr');

                    const values = [
                        '#' + (item.number ?? ''),
                        item.childName ?? '',
                        item.parentName ?? '',
                        item.mobile ?? ''
                    ];

                    values.forEach(function (value) {
                        const cell = document.createElement('td');
                        cell.textContent = String(value);
                        row.appendChild(cell);
                    });

                    tbody.appendChild(row);
                });

            } catch (err) {
                console.error('خطأ جلب بيانات المعلمة:', err);

                tbody.innerHTML =
                    '<tr><td colspan="4" style="text-align:center; color:red;">تعذّر جلب البيانات.</td></tr>';

                status.textContent =
                    'فشل الاتصال ببيانات Google Sheets. افتحي Console في المتصفح لمعرفة تفاصيل الخطأ.';
                status.className = 'status-message error-message';

            } finally {
                refreshBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
